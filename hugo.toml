  description = 'Thoughtfully crafted Hugo and Tailwind website kits for documentation, startups, and ambitious teams. Own your code. Launch with confidence.'
  author = 'NamahNest Studio'
  email = 'namahnest@gmail.com'
  github = ''
  contactEndpoint = ''
  socialImage = '/images/social-card.png'
